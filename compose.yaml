# NEXUS in server mode: interface on http://localhost:8080, server and PostgreSQL only inside the compose network.
# Local demo values; there are no user accounts (Spec 16) — do not expose this to the internet.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus # demo value, the database is not published
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      NEXUS_DB_URL: jdbc:postgresql://db:5432/nexus
      NEXUS_DB_USER: nexus
      NEXUS_DB_PASSWORD: nexus
    command:
      - --spring.profiles.active=compose
      - --nexus.ws.allowed-origins=http://localhost:8080
      - --nexus.allowed-hosts=localhost
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:8080:80" # only this computer: the API has no login (Spec 16)
    depends_on:
      - app
