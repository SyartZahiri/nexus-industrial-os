spring:
  application:
    name: nexus
  profiles:
    default: embedded
  datasource:
    url: ${NEXUS_DB_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${NEXUS_DB_USER:nexus}
    password: ${NEXUS_DB_PASSWORD:nexus}
    hikari:
      maximum-pool-size: 20
      connection-init-sql: set lock_timeout = '5s'
nexus:
  sim:
    seed: 4711
